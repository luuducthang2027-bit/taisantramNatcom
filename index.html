<!DOCTYPE html>
<html lang="vi" translate="no"><head><meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tài sản trạm Natcom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>/* Tài sản trạm Natcom: navy + cam Natcom, gọn như tool Tồn kho */
:root{--nav:#1B2638;--nav2:#243149;--nav-ink:#CDD5E1;--nav-mut:#7F8BA0;--acc:#F7941D;--acc2:#E07B00;--acc-soft:#FEF1E1;
--paper:#F3F5F8;--card:#fff;--line:#DDE2EA;--line2:#EEF1F5;--ink:#1C2333;--mut:#5E6779;--ok:#0E7C5A;--ok-soft:#E3F3EC;--wa:#A86400;--wa-soft:#FCF0DA;--bad:#C0322B;--bad-soft:#FCE8E6;--bar:#33415C;--bar2:#B9C4D6;
--f:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{font:13px/1.5 var(--f);background:var(--paper);color:var(--ink);display:flex}
button,select,input{font:inherit;color:var(--ink)}
/* menu */
.nv{width:212px;flex:none;background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.lg{display:flex;gap:10px;align-items:center;padding:14px 14px 10px}
.lg svg{width:36px;height:36px;flex:none}.lg b{display:block;color:#fff;font-size:14px;font-weight:600;line-height:1.2}.lg small{color:var(--nav-mut);font-size:11px}
.menu{flex:1;overflow:auto;padding:0 8px}
.menu h6{margin:12px 8px 4px;font-size:10.5px;font-weight:500;color:var(--nav-mut);letter-spacing:.02em}
.menu a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;color:var(--nav-ink);cursor:pointer;font-weight:500;font-size:12.5px;text-decoration:none}
.menu a:hover{background:var(--nav2)}.menu a.on{background:var(--acc);color:#fff}
.menu a .bd{margin-left:auto;background:#ffffff22;border-radius:9px;padding:0 6px;font-size:10.5px}.menu a.on .bd{background:#ffffff33}
.sv{padding:10px 14px 14px;font-size:11px;color:var(--nav-mut);border-top:1px solid #ffffff12}
.sv .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#7F8BA0}
.sv .dot.ok{background:#3CC98B}.sv .dot.wa{background:#F2B33D}.sv .dot.er{background:#F06A5F}
.sv button{margin-top:6px;background:transparent;border:1px solid #ffffff2a;color:var(--nav-ink);border-radius:14px;padding:2px 10px;font-size:11px;cursor:pointer}
/* khung chính */
.mn{flex:1;display:flex;flex-direction:column;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:8px 18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:16px;margin:0 auto 0 0;font-weight:600;white-space:nowrap}
header h1 small{display:block;font-size:11px;color:var(--mut);font-weight:400}
.fl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fl label{font-size:11px;color:var(--mut)}
select,input[type=text],input[type=number],input[type=password],input[type=search],input[type=date]{border:1px solid var(--line);border-radius:7px;padding:5px 9px;background:var(--card);font-size:12.5px;height:32px}
select:focus,input:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:5px 13px;cursor:pointer;font-weight:500;font-size:12.5px;height:32px;white-space:nowrap}
.btn:hover{border-color:var(--mut)}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.p:hover{background:var(--acc2)}
.btn.s{height:26px;padding:2px 10px;font-size:11.5px}.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:16px;overflow:hidden;height:32px}
.seg button{border:0;background:var(--card);padding:0 11px;cursor:pointer;font-size:12px;font-weight:500}.seg button.on{background:var(--bar);color:#fff}
.srch{position:relative}.srch input{width:230px;padding-left:28px}
.srch:before{content:"";position:absolute;left:10px;top:10px;width:9px;height:9px;border:2px solid var(--mut);border-radius:50%}
.sug{position:absolute;top:36px;left:0;right:0;min-width:300px;background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 28px #0002;z-index:40;max-height:360px;overflow:auto;display:none}
.sug div{padding:7px 11px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line2);font-size:12.5px}
.sug div:hover,.sug div.on{background:var(--acc-soft)}.sug small{color:var(--mut);white-space:nowrap}
main{padding:14px 18px 40px;max-width:1360px;width:100%}
.pg{display:none}.pg.on{display:block;animation:fi .25s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(5px)}}
@media(prefers-reduced-motion:reduce){.pg.on{animation:none}}
/* thẻ, lưới */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 small{font-weight:400;color:var(--mut);font-size:11.5px}
.card h3 .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g2>.card,.g3>.card{margin-bottom:0}.gap{height:12px}
.k{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));margin-bottom:12px}
.k>div{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bar);border-radius:9px;padding:8px 12px;cursor:default}
.k>div.o{border-left-color:var(--acc)}.k>div.w{border-left-color:var(--bad)}.k>div.g{border-left-color:var(--ok)}
.k span{font-size:11px;color:var(--mut)}.k b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.k small{color:var(--mut);font-size:11px}
.up{color:var(--ok)}.dn{color:var(--bad)}.mu{color:var(--mut)}.wa{color:var(--wa)}.b{font-weight:600}
.al{border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:12.5px;line-height:1.9}.al .chip{margin:0 4px 0 0}
.al.err{background:var(--bad-soft);border:1px solid #F3C4BF}.al.warn{background:var(--wa-soft);border:1px solid #F1D9A8}.al.info{background:#EAF1FB;border:1px solid #CCDBF1}.al.ok{background:var(--ok-soft);border:1px solid #BFE3D2}
.al b.t{margin-right:4px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--acc)}
.tag{display:inline-block;border-radius:9px;padding:1px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--wa-soft);color:var(--wa)}.tag.err{background:var(--bad-soft);color:var(--bad)}.tag.info{background:var(--line2);color:var(--mut)}.tag.acc{background:var(--acc-soft);color:var(--acc2)}
/* thanh ngang */
.hb{display:grid;grid-template-columns:92px minmax(0,1fr) 92px 80px;gap:8px;align-items:center;margin:4px 0;font-size:12px;border-radius:6px;padding:1px 4px}
.hb.c{cursor:pointer}.hb.c:hover{background:var(--line2)}
.hb .tr{height:12px;background:var(--line2);border-radius:6px;position:relative;overflow:hidden}
.hb .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--bar)}
.hb .tr i.a{background:var(--acc)}.hb .tr i.p{background:var(--bar2);top:0;bottom:6px}.hb .tr i.p+i{top:6px}
.hb .tr i.r{background:var(--bad)}.hb .tr i.g{background:var(--ok)}
.hb>span{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.hb>b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(prefers-reduced-motion:no-preference){.hb .tr i{transform-origin:left;animation:gw .7s cubic-bezier(.2,.8,.2,1)}}
@keyframes gw{from{transform:scaleX(0)}}
.whb .hb{grid-template-columns:170px minmax(0,1fr) 80px 70px}
.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:6px}.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* bảng */
.tw{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 9px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:#F6F7FA;font-weight:600;font-size:11.5px;color:var(--mut);cursor:pointer;user-select:none;z-index:1}
th.l,td.l{text-align:left}th:hover{color:var(--ink)}th .ar{font-size:9px;margin-left:3px;color:var(--acc)}
tr.c{cursor:pointer}tr.c:hover td{background:var(--acc-soft)}
td.wrap{white-space:normal;min-width:220px}
tfoot td{font-weight:600;background:#F6F7FA;position:sticky;bottom:0}
td.red,span.red{color:var(--bad);font-weight:600}td.redbg{background:var(--bad-soft);color:var(--bad);font-weight:600}
.more{text-align:center;padding:8px;font-size:12px}
/* ngăn chi tiết */
.dr{position:fixed;inset:0;z-index:60;display:none}.dr.on{display:block}
.dr .ov{position:absolute;inset:0;background:#0F172A66}
.dr .bx{position:absolute;right:0;top:0;bottom:0;width:min(920px,96vw);background:var(--paper);overflow:auto;padding:16px 18px;box-shadow:-10px 0 30px #0003;animation:sl .22s ease-out}
@keyframes sl{from{transform:translateX(30px);opacity:.4}}
.dr .x{float:right}
.dr h2{margin:0 0 4px;font-size:17px}
/* hộp thoại */
.md{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:#0F172A66;padding:16px}.md.on{display:flex}
.md .bx{background:var(--card);border-radius:12px;padding:16px 18px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 50px #0004}
.md h3{margin:0 0 10px;font-size:15px}
.md .act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.fm{display:grid;gap:10px}.fm label{font-size:12px;color:var(--mut);display:grid;gap:4px}
/* tab con */
.sub{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.sub button{border:0;background:none;border-bottom:3px solid transparent;padding:7px 14px;cursor:pointer;font-weight:500;color:var(--mut)}
.sub button.on{border-bottom-color:var(--acc);color:var(--ink)}
.sub button .tag{margin-left:6px}
/* vùng thả file */
.dz{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--mut);cursor:pointer;background:var(--card);transition:.15s}
.dz:hover,.dz.on{border-color:var(--acc);background:var(--acc-soft);color:var(--ink)}
.dz b{display:block;font-size:14px;color:var(--ink);margin-bottom:4px}
.rp{border:1px solid var(--line);border-radius:9px;margin:8px 0;background:var(--card)}
.rp>div:first-child{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.rp ul{margin:6px 0;padding:0 12px 4px 30px;font-size:12px}.rp li{margin:2px 0}.rp li.err{color:var(--bad)}.rp li.warn{color:var(--wa)}
.empty{padding:34px 16px;text-align:center;color:var(--mut)}.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.fig{position:relative;width:100%}.fig svg{display:block;width:100%}
.ring{display:flex;gap:14px;align-items:center}
.ld{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--nav);color:#fff;padding:8px 16px;border-radius:18px;font-size:12.5px;z-index:80;display:none;box-shadow:0 6px 20px #0004}.ld.on{display:block}
.tt{position:fixed;pointer-events:none;background:var(--nav);color:#fff;font-size:11.5px;padding:5px 9px;border-radius:6px;z-index:90;display:none;white-space:nowrap}
.hide{display:none!important}
@media(max-width:900px){body{display:block}.nv{width:auto;height:auto;position:sticky;top:0;z-index:30;flex-direction:row;align-items:center}
.lg{padding:8px 10px}.lg div{display:none}.menu{display:flex;overflow-x:auto;padding:6px;gap:2px}.menu a{flex:none}.menu h6{display:none}.menu a{white-space:nowrap}.sv{display:none}
header{top:52px}.srch input{width:160px}main{padding:10px}.g2,.g3{grid-template-columns:minmax(0,1fr)}.hb{grid-template-columns:70px minmax(0,1fr) 76px 64px}}
@media print{.nv,header .fl,.btn{display:none}main{max-width:none}}
</style>

<script>'use strict';
/* ===== Tài sản trạm Natcom ===== */
const VER='1.0.0';
const DEFAULT_API='https://script.google.com/macros/s/AKfycbygcV5MsBdwX3gwoRN9csLZ09_Q9j0rlKtH4oIli6yl9FtmUZGQXuaGeF7mGQF6rWtV/exec';                 // link Apps Script /exec, điền khi đóng gói
const BRS=['ART','CEN','NOR','NOT','OUE01','OUE02','OUE03','SUD'];
const ADMIN_HASH='';
const CFG0={rate:131,thr:5000,excl:['005812'],eq:[['300121','272583','040043','026329'],['300068','301524','268637']],emails:''};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;const n=parseFloat(String(v??'').replace(/,/g,'').trim());return isFinite(n)?n:0};
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const vnd=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const vnm=s=>s?s.slice(5,7)+'/'+s.slice(0,4):'';
function pdate(v){if(v==null||v==='')return'';if(v instanceof Date)return isNaN(v)?'':ymd(v);
 if(typeof v==='number'){if(v>20000&&v<80000)return new Date(Math.round((Math.floor(v)-25569)*864e5)).toISOString().slice(0,10);return''}
 const s=String(v).trim();let m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s);if(m)return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
 m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/.exec(s);if(m)return m[3]+'-'+p2(m[2])+'-'+p2(m[1]);return''}
const addDay=(s,n)=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/864e5);
const mc=v=>{const s=String(v??'').trim();if(!s)return'';return /^\d+(\.0+)?$/.test(s)?String(Math.round(Number(s))).padStart(6,'0'):s.toUpperCase()};
const wait=ms=>new Promise(r=>setTimeout(r,ms)),tick=()=>new Promise(r=>setTimeout(r,0));
const ld=t=>{const e=$('#ld');if(t){e.textContent=t;e.classList.add('on')}else e.classList.remove('on')};
function toast(t,ms=2600){ld(t);clearTimeout(toast.h);toast.h=setTimeout(()=>ld(''),ms)}
/* ----- định dạng tiền ----- */
const S={cfg:{...CFG0},unit:'USD',A:'',B:'',br:'',tab:'dash',admin:false,pw:''};
try{S.unit=localStorage.getItem('tts_unit')||'USD'}catch(e){}
const rt=()=>S.unit==='USD'&&S.cfg.rate>0?S.cfg.rate:1;
const nf0=new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}),nf1=new Intl.NumberFormat('vi-VN',{maximumFractionDigits:1}),nf2=new Intl.NumberFormat('vi-VN',{maximumFractionDigits:2});
const F=v=>{const x=v/rt();return Math.abs(x)<10&&x!==0?nf2.format(x):nf0.format(x)};
const Q=v=>nf2.format(Math.round(v*100)/100);
function C(v){const x=v/rt(),a=Math.abs(x);return a>=1e9?nf2.format(x/1e9)+' tỷ':a>=1e6?nf2.format(x/1e6)+' tr':a>=1e3?nf1.format(x/1e3)+' N':nf0.format(x)}
const sg=(v,f=C)=>`<span class="${v>0.5?'up':v<-0.5?'dn':'mu'}">${v>0.5?'+':''}${f(v)}</span>`;
const pct=(a,b)=>b?((a-b)/Math.abs(b)*100):null;
const P=v=>v==null?'':(v>0?'+':'')+nf1.format(v)+'%';
const uName=()=>S.unit==='USD'?'USD':'gốc';
/* ----- SHA-256 gọn (dùng cho mật khẩu bản offline) ----- */
function sha256(str){const K=[],H=[];let p=2,n=0;const ip=x=>{for(let i=2;i*i<=x;i++)if(x%i==0)return 0;return 1},fr=x=>(x-(x|0))*4294967296|0;
 while(n<64){if(ip(p)){if(n<8)H[n]=fr(Math.pow(p,1/2));K[n++]=fr(Math.pow(p,1/3))}p++}
 const b=new TextEncoder().encode(str),l=b.length*8,w=[],m=new Uint8Array(((b.length+9+63)>>6)<<6);m.set(b);m[b.length]=0x80;const dv=new DataView(m.buffer);dv.setUint32(m.length-4,l);
 const h=H.slice(),r=(x,y)=>(x>>>y)|(x<<(32-y));
